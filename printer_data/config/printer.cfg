#########################################################
# INCLUSIONS
#########################################################

[include fluidd.cfg]
[include configs/*]
[include macros/*]
[gcode_arcs]
[skew_correction]

#########################################################
# MCU'S
#########################################################

# Mainboard
[mcu]
canbus_uuid: 7a4419663df7

# Raspberry Pi
[mcu host]
serial: /tmp/klipper_host_mcu

# Toolhead EBB36
[mcu EBB]
canbus_uuid: 0919569c3e19

[virtual_sdcard]
path: /home/pi/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[force_move]
enable_force_move: True

[pause_resume]
recover_velocity: 50.

[respond]
default_type: echo
default_prefix: 

[idle_timeout]
timeout: 900
gcode:
    LED_OFF
    status_off
    M84
    M140 S0
    M104 S0

[save_variables]
filename: vars.txt

[delayed_gcode my_delayed_gcode]
initial_duration: 1.0
gcode:
    {% set saved_vars = printer.save_variables.variables %}
    LED_WHITE
    status_ready
    SAVE_VARIABLE VARIABLE=wait_for_temp VALUE=1

