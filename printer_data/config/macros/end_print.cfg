[gcode_macro END_PRINT]
gcode:
    SET_SKEW CLEAR=1

    LED_GREEN
    status_success

    # Move nozzle away from print while retracting
    G91
    G1 X-2 Y-2 E-3 F300
    # Raise nozzle by 10mm
    G1 Z10 F1800
    G90
    G1 X5 Y345 F18000

    # Turn off bed, extruder, and fan
    M140 S0
    G1 E-25 F1000
    M104 S0
    M106 S0

    # Disable steppers
    M84