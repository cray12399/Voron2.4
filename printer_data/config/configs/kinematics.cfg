[printer]
kinematics: corexy
max_velocity: 1000
max_accel: 75000
max_z_velocity: 150
max_z_accel: 1000
square_corner_velocity: 25.0

[axis_twist_compensation]
calibrate_start_x: 30
calibrate_end_x: 320
calibrate_y: 175
calibrate_start_y: 30
calibrate_end_y: 320
calibrate_x: 175
horizontal_move_z: 5
speed: 200

#########################################################
# RESONANCES
#########################################################

[include probing.cfg]

[adxl345]
cs_pin: cartographer:PA3
spi_bus: spi1

[resonance_tester]
accel_chip: adxl345
probe_points:
   175, 175, 20

[input_shaper]
shaper_type_x = mzv
shaper_freq_x = 68
shaper_type_y = mzv
shaper_freq_y = 48